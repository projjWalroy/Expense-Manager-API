spring.application.name=ExpenseTrackerAPI

spring.datasource.url= jdbc:mysql://localhost:3306/expensetracker
spring.datasource.username=root
spring.datasource.password=passw0rd

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.servlet.context-path=/api/v1

jwt.secret=foof

# Basic logging levels
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

# Colorful Console Logging Pattern
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){cyan} %clr(%5p) %clr([%t]){magenta} --- %clr(%logger{36}){yellow} : %clr(%m){green}%n%wex

# Enable ANSI colors in the console
spring.output.ansi.enabled=always


